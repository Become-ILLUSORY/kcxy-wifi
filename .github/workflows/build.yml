name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            goarm: ""
            name: linux-amd64
          - goarch: arm64
            goarm: ""
            name: linux-arm64
          - goarch: arm
            goarm: "7"
            name: linux-armv7
          - goarch: mipsle
            goarm: ""
            name: linux-mipsle
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o kcxy-wifi .
          tar -czf kcxy-wifi-${{ matrix.name }}.tar.gz \
            kcxy-wifi config.example.ini accounts.example.json \
            kcxy-wifi.service kcxy-wifi@.service LICENSE README.md
          sha256sum kcxy-wifi-${{ matrix.name }}.tar.gz > kcxy-wifi-${{ matrix.name }}.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: kcxy-wifi-${{ matrix.name }}
          path: |
            kcxy-wifi-${{ matrix.name }}.tar.gz
            kcxy-wifi-${{ matrix.name }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  aur:
    needs: release
    runs-on: ubuntu-latest
    # AUR 需要维护者私钥，没配置时跳过而不是让整个流程失败
    if: startsWith(github.ref, 'refs/tags/v') && vars.AUR_PUBLISH == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Update AUR package
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # 固定 AUR 的主机公钥，避免 ssh-keyscan 被中间人替换
          cat >> ~/.ssh/known_hosts <<'EOF'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          EOF
          cat >> ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
          EOF
          chmod 600 ~/.ssh/config
          ./aur/update-aur.sh "${GITHUB_REF_NAME#v}"
