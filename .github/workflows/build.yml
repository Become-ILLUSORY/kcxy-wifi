name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            goarm: ""
            name: linux-amd64
          - goarch: arm64
            goarm: ""
            name: linux-arm64
          - goarch: arm
            goarm: "7"
            name: linux-armv7
          - goarch: mipsle
            goarm: ""
            name: linux-mipsle
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o kcxy-wifi .
          tar -czf kcxy-wifi-${{ matrix.name }}.tar.gz \
            kcxy-wifi config.example.ini accounts.example.json \
            kcxy-wifi.service kcxy-wifi@.service LICENSE README.md
          sha256sum kcxy-wifi-${{ matrix.name }}.tar.gz > kcxy-wifi-${{ matrix.name }}.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: kcxy-wifi-${{ matrix.name }}
          path: |
            kcxy-wifi-${{ matrix.name }}.tar.gz
            kcxy-wifi-${{ matrix.name }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
