[account]
# 账号密码从 JSON 文件读取，支持多个账号，按顺序尝试直到有一个能用
accounts_file = accounts.json

[network]
# 连接校园网的无线网卡
wifi_interface = wlan0
# 门户地址
portal_host = 10.147.103.3
# 认证设备标识，一般留空
wlanacname =
# 掉线时用于重连的 SSID，留空则不自动重连
ssid = KCXY-Teacher
# 联网检测地址
test_url = http://www.baidu.com
# 下线状态文件，留空则自动选择（系统级 /var/lib/kcxy-wifi/paused）
state_file =

[behavior]
# 在线检测间隔（秒）
check_interval = 30
# 认证失败后的重试间隔（秒）
retry_interval = 5
# 连续失败多少次后进入长退避
max_retries = 6
# 长退避时间（秒）
backoff_interval = 120
